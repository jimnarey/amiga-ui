exclude: '^\.deprecated/'
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --exit-non-zero-on-fix
        language: unsupported
        types: [python]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check
        language: unsupported
        types: [python]
        require_serial: true

      - id: pyright
        name: pyright
        entry: uv run pyright
        language: unsupported
        pass_filenames: false
        files: '^(src|tests|tools)/.*\.py$'
        require_serial: true

      - id: check-yaml
        name: check yaml
        entry: uv run python tools/check_yaml.py
        language: unsupported
        types: [yaml]
