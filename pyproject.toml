[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amiga-ui"
version = "0.1.0"
description = "Workbench application compatibility layer research and implementation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "amitools[vamos]",
    "PySide6",
]

[project.scripts]
amiga-ui = "amiga_ui.cli:main"
amiga-ui-xvfb = "amiga_ui.host.xvfb:main"

[tool.hatch.build.targets.wheel]
packages = ["src/amiga_ui"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pyright>=1.1.411",
    "ruff>=0.16.2",
]
agent = [
    "pydantic-ai>=1.0.0",
]
