[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amiga-ui"
version = "0.1.0"
description = "Workbench application compatibility layer research and implementation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "amitools[vamos]",
    "capstone>=5.0.6",
    "PySide6",
]

[project.scripts]
amiga-ui = "amiga_ui.cli:main"
amiga-ui-xvfb = "amiga_ui.host.xvfb:main"
amiga-ui-extract-adfs = "amiga_ui.adf_extract:main"
amiga-ui-generate-api-index = "amiga_ui.api_index:main"
amiga-ui-analyze-failure = "amiga_ui.failure_analyzer:main"

[tool.hatch.build.targets.wheel]
packages = ["src/amiga_ui"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pyright>=1.1.411",
    "ruff>=0.16.2",
]
agent = [
    "pydantic-ai>=1.0.0",
]
